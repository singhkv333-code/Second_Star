name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "pivot/**"
      - "pivot-backtester/**"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: pivotacrindia
  RESOURCE_GROUP: Pivot
  CONTAINER_APP: pivot-backend
  IMAGE: pivot-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (ACR Tasks — no Docker needed on the runner)
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE:${{ github.sha }} \
            --image $IMAGE:latest \
            --file pivot/Dockerfile \
            .

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}
