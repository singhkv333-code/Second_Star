# The nginx site for charto: /etc/nginx/sites-available/charto
# (symlinked from sites-enabled/charto).
#
# THIS FILE IS NOW APPLIED, NOT MERELY RECORDED. deploy.sh compares it against
# the installed copy on every tick and hands any difference to apply_nginx.sh,
# which tests the candidate, backs up the live one, reloads, probes, and rolls
# back on any failure. See that script for why a reload is now safe to automate.
#
# ── the trap this file used to be ────────────────────────────────────────────
#
# Everything below used to hang off an explicit ROUTE ALLOWLIST: one regex
# listing every backend prefix, and a `try_files $uri $uri/ /index.html`
# fall-through for everything else. Both halves of that were wrong.
#
#   1. A new backend endpoint was unreachable in production until somebody
#      remembered to add its prefix here. Nothing enforced it and nothing
#      noticed. /auth, /workspace and /layouts shipped without it; then
#      /suggest, /conversations, /alerts, /alerts/stream and /journal; then
#      /quotes, /patterns/draw, /execution/backtest, /audio/transcribe and
#      /shared. Three separate rounds of the same bug.
#
#   2. The failure is SILENT and it inverts every signal. An unlisted route
#      does not 404 — it falls through to index.html and returns **200 with
#      427 KB of chart page**. `r.ok` is true, `r.json()` throws, the FE's
#      `catch {}` swallows it, and the feature renders blank with nothing in
#      any log. Measured 2026-08-31: the watchlist showed an em-dash for every
#      price on the deployed site and a real one on localhost, because /quotes
#      was answering with HTML.
#
# So the allowlist is gone. The rule is inverted: **anything that is not a file
# under preview/ belongs to the backend.** A route now works the day it ships,
# an unknown path gets the backend's honest JSON 404 instead of half a megabyte
# of HTML, and there is no list left to forget to update.
#
# The blocks that remain are not an allowlist. Each one exists because that
# route needs something `@backend` does not give it — its own rate-limit zone,
# buffering off for SSE, a different upstream, or no cache header.
#
# check_routes.sh still probes the live host after every reload. It no longer
# parses an allowlist out of this file (there isn't one); it asks the frontend's
# own fetch calls and asserts the fall-through proxies rather than answers HTML.
server {
    server_name charto-india.centralindia.cloudapp.azure.com;


    # 16m, because the backend's own cap is 15 MB (_AUDIO_MAX_BYTES, the voice
    # recording POSTed to /audio/transcribe as a raw body). At 8m nginx refused
    # first, with an HTML error page the FE's `r.json().catch(() => ({}))`
    # turned into the same generic "Voice transcription failed" it shows for a
    # dead microphone. Whichever limit is real should be the one that speaks,
    # and only the backend's answers in JSON.
    client_max_body_size 16m;

    # 4000 bars of JSON is 334,838 bytes raw and 62,340 gzipped (5.4x). The
    # chart refetches on every interval switch and symbol change, so transfer
    # was the largest single slice of wall time on this link.
    gzip on;
    # No text/html here: nginx compresses it unconditionally and listing it
    # again is a `duplicate MIME type` warning on every config test.
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;


    # static chart UI
    root /data/app/charto/preview;
    index index.html;

    # ALWAYS revalidate. Never reuse an asset without asking.
    #
    # There was no Cache-Control here at all, and that is not "no caching" — it
    # is the worst of both. With no directive and no Expires, a browser falls
    # back to HEURISTIC freshness and may reuse a file for a fraction of its age
    # without sending a request at all. Nothing on the wire can correct it.
    #
    # That is what makes a deploy look half-applied. Every js/*.js is cache-
    # busted by a ?v= typed by hand into index.html, so the URL only changes if
    # somebody remembers to change it — and b6e2545 changed six JS files while
    # bumping one. The other five kept their URLs, so a returning browser held
    # old JS against new CSS and no amount of redeploying could dislodge it.
    # serve.py sends `no-store` locally, which is precisely why this has never
    # been visible in development.
    #
    # `no-cache`, NOT `no-store`: the response is still stored and still
    # answered 304 off its ETag, so the cost is a conditional request rather
    # than a re-download, and on HTTP/2 they all share the one connection. The
    # 1 MB vendor bundle is therefore still effectively cached — it just has to
    # admit when it has changed.
    #
    # The fall-through is @backend, NOT /index.html. `/` still serves the page
    # (the `index` directive answers the directory); a path that is not a file
    # is a backend route, and one that is neither gets the backend's 404.
    location / {
        try_files $uri $uri/ @backend;
        add_header Cache-Control "no-cache" always;
    }

    # Everything the static root did not answer.
    #
    # This is the whole route table now. A backend endpoint is reachable the
    # moment it exists, in the order dataserver.py already dispatches them, and
    # a typo reaches the backend and is told so in JSON.
    #
    # `data` limits and a 300s read timeout: the slowest thing that lands here
    # is a cold read against the 29 GB bar store.
    #
    # X-Real-IP / X-Forwarded-For on every proxy block: without them the
    # dataserver sees 127.0.0.1 for every request on the box and cannot tell
    # two visitors apart at all — which is why the only per-IP limit that
    # exists today is nginx's own, and why a per-ACCOUNT quota has nothing to
    # attribute against. nginx is the only place the real address survives.
    location @backend {
        limit_req zone=charto_data burst=400 nodelay;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Machine-readable liveness/readiness. Exact-match with no rate limit, so a
    # monitor is never told 429 and never has to share a bucket with the chart.
    # Backups, both SQLite stores, disk headroom and LLM config are checked by
    # the backend; deep=1 additionally probes Execution mode.
    location = /health {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # SSE: /stream is a forming-bar feed and /chat streams tokens. Buffering
    # here would hold every event until the response ended, which for an
    # endless stream means forever — the page would look hung, not slow.
    # /alerts/stream is the third SSE endpoint: one event per fired alert, per
    # signed-in user.
    location ~ ^/(stream|chat|alerts/stream)$ {
        limit_req zone=charto_chat burst=20 nodelay;
        limit_conn charto_conn 128;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Brute-force surface, split out purely so it can carry its own limit.
    #
    # The CREDENTIAL endpoints only. This used to be all of `^/auth/`, which
    # swept in /auth/me — the call the page makes on every single boot to decide
    # which UI to paint. A guess-rate limit and a page-load rate are three orders
    # of magnitude apart, and sharing one bucket means either the limit is too
    # loose to slow an attacker or a few reloads log you out. /auth/me and
    # /auth/logout fall through to @backend and the data zone, where they belong.
    location ~ ^/auth/(login|signup|reset) {
        limit_req zone=charto_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /suggest is LEGACY and the recommended prompts no longer depend on it —
    # they ride /chat's own stream now, precisely BECAUSE this block spent its
    # life uninstalled on the box while the feature looked fine on localhost.
    # Kept for browsers still holding a cached index.html.
    #
    # It is an LLM call AND a stream, so it needs both halves: the chat rate
    # limit rather than the data one, and buffering off — gzip and
    # proxy_buffering each hold an SSE body until the response ends, which for
    # a stream means the three questions arrive at once or not at all.
    # Exact-match location, so it wins over the regex blocks regardless of
    # order. Its timeout is bounded, unlike /chat's: this call is one short
    # completion with no tool loop behind it.
    location = /suggest {
        limit_req zone=charto_chat burst=20 nodelay;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The company page, on this origin.
    #
    # It runs as its own Next app on :5175 and is REACHED through here rather
    # than beside here. Linked absolutely it was a second port in the address
    # bar — a different origin, so no shared cookie and no shared theme — and
    # on the deployed site it pointed at the visitor's own machine, where
    # nothing is listening. Two prefixes: the route itself and Next's build
    # output, which the page loads by absolute path and cannot do without.
    #
    # This one IS still an explicit list, and has to be: it is the only rule
    # here that picks a DIFFERENT upstream, so it cannot be inferred from "not
    # a static file". `data` limits, not `chat`: this is page and asset
    # traffic, and one visit fires the document plus a dozen chunks.

    location ~ ^/(stock/|_next/|__nextjs) {
        limit_req zone=charto_data burst=400 nodelay;
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The two book pages, as EXACT locations rather than a prefix.
    #
    # This is the whole reason it cannot join the regex above: the PAGE is
    # `/paper` and its DATA is `/paper/summary`, `/paper/holdings`,
    # `/paper/fills` — same prefix, different upstream. A prefix or regex match
    # would hand every read of the book to Next, which has no such route, and
    # the dashboard would render empty against a 404 it could not explain. `=`
    # is nginx's highest-priority match, so these two win over the regex above;
    # everything else under /paper/ falls through to `location /` and reaches
    # the dataserver.
    location = /paper {
        limit_req zone=charto_data burst=400 nodelay;
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /strategies {
        limit_req zone=charto_data burst=400 nodelay;
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The research chat, behind the company page's ask bar.
    #
    # A third upstream (`pivotted/` on :5176) and the same rule as the chart's
    # own /chat: it is SSE, so buffering must be off or the whole answer lands
    # in one lump at the end and a bar that streams looks like a bar that
    # hung. `/research/chat/stream` is rewritten to `/chat/stream` — the
    # prefix names a route on THIS origin, and the server behind it has never
    # heard of it. It carries the CHAT limit, not the data one: every request
    # here is a model turn, not a page asset.
    location /research/ {
        limit_req zone=charto_chat burst=20 nodelay;
        limit_conn charto_conn 128;
        rewrite ^/research/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        chunked_transfer_encoding off;
    }

    location = /paper/ {
        limit_req zone=charto_data burst=400 nodelay;
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/charto-india.centralindia.cloudapp.azure.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/charto-india.centralindia.cloudapp.azure.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = charto-india.centralindia.cloudapp.azure.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name charto-india.centralindia.cloudapp.azure.com;
    return 404; # managed by Certbot


}
