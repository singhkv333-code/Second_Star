# The LIVE nginx site from the VM: /etc/nginx/sites-available/charto
# (symlinked from sites-enabled/charto), captured 2026-08-04.
#
# Committed as the record, not as something deploy.sh applies. Installing it
# needs root and a reload, and a bad reload takes the site down — that belongs
# behind a human, not behind a 30s timer. The point is that it stops being
# invisible: the gzip and HTTP/2 work in 0555dd3 was described in a commit
# message while the config itself lived only on the box, so the repo could not
# tell you how anything was actually served.
#
# To apply after editing:
#   sudo cp charto/deploy/nginx-charto.conf /etc/nginx/sites-available/charto
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note the route allowlist below: a NEW backend endpoint is not reachable in
# production until its prefix is added there. /auth, /workspace and /layouts
# shipped without it and silently served index.html to the login form.
#
# That warning was not enough, because it only covers half the failure. The
# other half is that this file being CORRECT does not make the box correct —
# nothing applies it, so a route added here and never installed reads exactly
# like a route that was never added. Measured 2026-08-13: the live box was
# still on the 2026-08-04 capture, so /suggest, /conversations, /alerts,
# /alerts/stream and /journal all fell through to index.html. Every one of
# them returns **200 with the HTML page**, so the browser's `r.ok` is true and
# `r.json()` throws into an empty object — the Journal panel and the
# recommended prompts rendered blank in production while both worked locally.
#
# Do not trust reading this file. Run ./check_routes.sh after every reload and
# after shipping any new endpoint; it probes the live host and fails on any
# route here that the box answers with HTML.
server {
    server_name charto-india.centralindia.cloudapp.azure.com;


    client_max_body_size 8m;

    # 4000 bars of JSON is 334,838 bytes raw and 62,340 gzipped (5.4x). The
    # chart refetches on every interval switch and symbol change, so transfer
    # was the largest single slice of wall time on this link.
    gzip on;
    gzip_types application/json application/javascript text/css text/html image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;


    # static chart UI
    root /data/app/charto/preview;
    index index.html;

    # ALWAYS revalidate. Never reuse an asset without asking.
    #
    # There was no Cache-Control here at all, and that is not "no caching" — it
    # is the worst of both. With no directive and no Expires, a browser falls
    # back to HEURISTIC freshness and may reuse a file for a fraction of its age
    # without sending a request at all. Nothing on the wire can correct it.
    #
    # That is what makes a deploy look half-applied. Every js/*.js is cache-
    # busted by a ?v= typed by hand into index.html, so the URL only changes if
    # somebody remembers to change it — and b6e2545 changed six JS files while
    # bumping one. The other five kept their URLs, so a returning browser held
    # old JS against new CSS and no amount of redeploying could dislodge it.
    # serve.py sends `no-store` locally, which is precisely why this has never
    # been visible in development.
    #
    # `no-cache`, NOT `no-store`: the response is still stored and still
    # answered 304 off its ETag, so the cost is a conditional request rather
    # than a re-download, and on HTTP/2 they all share the one connection. The
    # 1 MB vendor bundle is therefore still effectively cached — it just has to
    # admit when it has changed.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Machine-readable liveness/readiness. Exact-match so a missing backend can
    # never fall through to index.html and look healthy merely because the SPA
    # answered 200. Backups, both SQLite stores, disk headroom and LLM config
    # are checked by the backend; deep=1 additionally probes Execution mode.
    location = /health {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # SSE: /stream is a forming-bar feed and /chat streams tokens. Buffering
    # here would hold every event until the response ended, which for an
    # endless stream means forever — the page would look hung, not slow.
    # /alerts/stream is the third SSE endpoint: one event per fired alert, per
    # signed-in user. It is here rather than in the data block below because a
    # buffered SSE body is held until the response ends, and for an endless
    # stream that means forever — the bell would simply never light.
    location ~ ^/(stream|chat|alerts/stream)$ {
        limit_req zone=charto_chat burst=80 nodelay;
        limit_conn charto_conn 128;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Brute-force surface, split out of the allowlist below purely so it can
    # carry its own limit. Must precede it: regex locations match in order.
    location ~ ^/auth/ {
        limit_req zone=charto_auth burst=80 nodelay;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }

    # /suggest is LEGACY and the recommended prompts no longer depend on it —
    # they ride /chat's own stream now, precisely BECAUSE this block spent its
    # life uninstalled on the box while the feature looked fine on localhost.
    # Kept for browsers still holding a cached index.html.
    #
    # It is an LLM call AND a stream, so it needs both halves: the chat rate
    # limit rather than the data one, and buffering off — gzip and
    # proxy_buffering each hold an SSE body until the response ends, which for
    # a stream means the three questions arrive at once or not at all.
    # Exact-match location, so it wins over the regex blocks regardless of
    # order. Its timeout is bounded, unlike /chat's: this call is one short
    # completion with no tool loop behind it.
    location = /suggest {
        limit_req zone=charto_chat burst=80 nodelay;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
    }

    # data + tool routes
    location ~ ^/(bars|quotes|meta|symbols|indicator|indicators|volume_profile|patterns/|replay|live|company|api/|search|screen|peers|news|logo|profile|financials|results|deals|delivery|fut_oi|classification|benchmark|auth|workspace|layouts|conversations|alerts|journal|shared|audio/) {
        limit_req zone=charto_data burst=400 nodelay;
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    # The company page, on this origin.
    #
    # It runs as its own Next app on :5175 and is REACHED through here rather
    # than beside here. Linked absolutely it was a second port in the address
    # bar — a different origin, so no shared cookie and no shared theme — and
    # on the deployed site it pointed at the visitor's own machine, where
    # nothing is listening. Two prefixes: the route itself and Next's build
    # output, which the page loads by absolute path and cannot do without.
    #
    # `data` limits, not `chat`: this is page and asset traffic, and one visit
    # fires the document plus a dozen chunks.
    location ~ ^/(stock/|_next/|__nextjs) {
        limit_req zone=charto_data burst=60 nodelay;
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/charto-india.centralindia.cloudapp.azure.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/charto-india.centralindia.cloudapp.azure.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = charto-india.centralindia.cloudapp.azure.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name charto-india.centralindia.cloudapp.azure.com;
    return 404; # managed by Certbot


}
