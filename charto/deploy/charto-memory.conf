# /etc/systemd/system/charto.service.d/memory.conf
#
# The dataserver ran with MemoryMax=infinity while charto-web — the smaller,
# less critical of the two — was capped at 1 GB. On a 7.9 GB box holding a
# 29 GB memory-mapped SQLite store, the unbounded process is the one that takes
# the whole machine down instead of only itself.
#
# 3 GB against a measured 768-905 MB steady state is deliberately loose: this
# is a blast-radius limit, not a tuning knob. It has to sit well above the real
# working set, because a cap that trips in normal use is worse than no cap — it
# turns a slow request into a killed service.
#
# What counts against it: the process, the per-thread SQLite page caches
# (bounded at 32 MB each by CHARTO_DB_CACHE_MAX_KIB) and the resample cache
# (96 entries, CHARTO_INTRA_CACHE). mmap'd pages are NOT charged here — they
# are page cache, which is exactly why mmap rather than a private cache is what
# makes cold reads fast on this box.
#
# MemoryHigh first, so pressure arrives before the kill: past 2.5 GB the kernel
# throttles and reclaims, and only a genuine runaway reaches the hard limit.
# Restart=always is already set, so the worst case is a restart with the reason
# in the journal rather than a silent box-wide OOM.
[Service]
MemoryHigh=2560M
MemoryMax=3G
