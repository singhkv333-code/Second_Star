# Rate limits for charto. Installed at /etc/nginx/conf.d/charto-ratelimit.conf
# — conf.d is included from nginx.conf's http block, and limit_req_zone is only
# valid there, which is why this is a separate file from the site.
#
# These exist because removing the basic-auth prompt put /chat on the open
# internet, and /chat is the one endpoint that spends money: every request is
# an Azure OpenAI turn. An unmetered public LLM endpoint is somebody else's
# free API key.
#
# The three zones are sized by what the endpoint COSTS, not by what feels tidy:
#
#   chat  12r/m  — a real turn takes 10-20s, so a person cannot exceed ~4/min.
#                  12 leaves room for retries and still caps a scripted abuser
#                  at 12 LLM calls a minute per IP.
#   auth  10r/m  — login and signup are the brute-force surface. scrypt already
#                  makes each guess expensive server-side; this makes it slow
#                  from the outside too.
#   data 300r/m  — the chart legitimately bursts: switching interval or symbol
#                  refires bars/indicators/profile together, and a cold load
#                  fires dozens. Too tight here breaks normal use, which is the
#                  failure mode that actually gets a limit switched off.
#
# 10m of zone state holds ~160k distinct IPs, far past anything this box sees.
limit_req_zone $binary_remote_addr zone=charto_chat:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=charto_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=charto_data:10m rate=300r/m;

# 429, not nginx's default 503: a client should be able to tell "you are asking
# too fast" apart from "the server is broken", and only one of those is worth
# retrying.
limit_req_status 429;

# One IP should not be able to hold every worker open on the SSE endpoints,
# which stay connected for hours by design.
limit_conn_zone $binary_remote_addr zone=charto_conn:10m;
limit_conn_status 429;
