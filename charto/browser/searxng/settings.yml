# SearXNG for Pivot's Browser widget (charto/data/websearch.py reads its JSON).
# Private: reached only by the dataserver over the VNet, so no rate limiter.
use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo
      - google
      - mojeek
      - qwant
      - startpage
      - wikipedia
      - bing news
      - google news
      - yahoo news
      - qwant news

general:
  instance_name: "pivot-search"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en-IN"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  # set at build time from a build argument (provision_browser.sh); the
  # image lives only in our private registry
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0
  pool_connections: 50
