<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plays · Pivot</title>
<script>
  // the chart page's theme choice, before first paint
  (function () {
    var m = null;
    try { m = localStorage.getItem("charto_theme"); } catch (e) {}
    if (m !== "light" && m !== "dark") {
      m = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", m);
  })();
</script>
<link rel="icon" href="./assets/pivot-mark.png" type="image/png" sizes="128x128" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" />
<style>
:root {
  --font: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --text-2xs: 11px; --text-xs: 11.5px; --text-sm: 12px; --text-base: 12.5px;
  --weight-display: 500;
}
:root[data-theme="dark"] {
  --background: #000000; --foreground: #fbfcfc; --card: #1c1c1d; --muted: #1c1c1d;
  --hover-fill: rgba(255, 255, 255, .09); --border: #242424; --border-soft: #1a1a1a;
  --input: #1c1c1d; --primary: #fbfcfc; --primary-foreground: #0d0d0e;
  --ring: rgba(251, 252, 252, .5); --rail: #0b0b0c;
}
:root[data-theme="light"] {
  --background: #ffffff; --foreground: #0d0d0e; --card: #fbfbfc; --muted: #f5f5f5;
  --hover-fill: rgba(15, 18, 22, .075); --border: #e6e6e6; --border-soft: #ececee;
  --input: #ffffff; --primary: #0d0d0e; --primary-foreground: #ffffff;
  --ring: rgba(13, 13, 14, .35); --rail: #f7f7f8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--background); color: var(--foreground);
  font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ── the frame: a rail and a conversation ───────────────────────────────── */
.pc { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.pc-rail { background: var(--rail); border-right: 1px solid var(--border); display: flex;
  flex-direction: column; min-height: 0; }
.pc-railtop { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; }
.pc-brand { font-family: var(--font-serif); font-size: 22px; font-weight: 500; text-decoration: none; }
.pc-tochart { font-size: var(--text-sm); font-weight: 550; text-decoration: none; padding: 5px 9px;
  border: 1px solid var(--border); border-radius: 8px; }
.pc-tochart:hover { background: var(--hover-fill); }
.pc-new { margin: 6px 10px 6px; height: 36px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--background); display: flex; align-items: center; gap: 8px; padding: 0 12px;
  font-weight: 600; cursor: pointer; }
.pc-new:hover { background: var(--hover-fill); }
.pc-nav { display: flex; flex-direction: column; padding: 2px 10px 6px; gap: 1px; }
.pc-scroll { flex: 1; overflow-y: auto; padding: 0 10px 12px; min-height: 0; }
.pc-h { font-size: var(--text-2xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  margin: 16px 6px 6px; }
.pc-item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 9px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer;
  font-size: 13px; line-height: 1.3; }
.pc-item:hover { background: var(--hover-fill); }
.pc-item.on { background: var(--hover-fill); font-weight: 600; }
.pc-item .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-item .s { flex: none; font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.pc-item .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--foreground); }
.pc-item .dot.armed { background: var(--foreground); }
.pc-none { font-size: 12.5px; line-height: 1.5; margin: 0 6px; }
.pc-me { border-top: 1px solid var(--border); padding: 10px 16px; font-size: 12.5px; display: flex;
  justify-content: space-between; gap: 8px; align-items: center; }
.pc-me button { background: none; border: 0; cursor: pointer; text-decoration: underline; font-size: 12.5px; padding: 0; }

.pc-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pc-bar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px;
  border-bottom: 1px solid var(--border-soft); }
.pc-bar h1 { margin: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-menu { display: none; width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px;
  background: none; cursor: pointer; }
.pc-body { flex: 1; overflow-y: auto; min-height: 0; }
.pc-col { max-width: 760px; margin: 0 auto; padding: 24px 20px 40px; }

/* ── the conversation ───────────────────────────────────────────────────── */
.pc-turn { margin: 0 0 26px; }
.pc-user { display: flex; justify-content: flex-end; }
.pc-user .b { max-width: 78%; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 10px 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.pc-ai { line-height: 1.6; font-size: 14.5px; overflow-wrap: anywhere; }
.pc-ai .md p { margin: 0 0 12px; }
.pc-ai .md h1, .pc-ai .md h2, .pc-ai .md h3 { font-family: var(--font-serif); font-weight: 500; margin: 18px 0 8px; line-height: 1.25; }
.pc-ai .md h1 { font-size: 22px; } .pc-ai .md h2 { font-size: 19px; } .pc-ai .md h3 { font-size: 17px; }
.pc-ai .md ul, .pc-ai .md ol { margin: 0 0 12px; padding-left: 22px; }
.pc-ai .md li { margin: 3px 0; }
.pc-ai .md table { border-collapse: collapse; margin: 4px 0 14px; font-size: 13px; font-variant-numeric: tabular-nums;
  display: block; overflow-x: auto; max-width: 100%; }
.pc-ai .md th, .pc-ai .md td { border-bottom: 1px solid var(--border); padding: 6px 12px 6px 0; text-align: left; white-space: nowrap; }
.pc-ai .md th { font-weight: 600; }
.pc-ai .md code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--card);
  border: 1px solid var(--border); border-radius: 5px; padding: 0 4px; }
.pc-ai .md pre { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; }
.pc-ai .md blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 2px solid var(--foreground);
  font-family: var(--font-serif); font-size: 16px; }
.pc-ai .md a { text-decoration: underline; text-underline-offset: 2px; }
.pc-card { margin: 4px 0 16px; max-width: 560px; }
.pc-status { display: flex; align-items: center; gap: 10px; font-size: 13.5px; margin: 2px 0 10px; }
.pc-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border);
  border-top-color: var(--foreground); animation: pcspin .8s linear infinite; }
@keyframes pcspin { to { transform: rotate(360deg); } }
.pc-meta { font-size: var(--text-xs); margin-top: 2px; font-variant-numeric: tabular-nums; }
.pc-err { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }

/* the empty conversation */
.pc-empty { padding-top: 12vh; }
.pc-empty h2 { font-family: var(--font-serif); font-weight: 500; font-size: 34px; line-height: 1.15; margin: 0 0 10px; }
.pc-empty p { margin: 0 0 26px; line-height: 1.55; font-size: 15px; max-width: 560px; }
.pc-ex { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pc-ex button { text-align: left; border: 1px solid var(--border); border-radius: 12px; background: none;
  padding: 12px 14px; cursor: pointer; line-height: 1.45; font-size: 13.5px; }
.pc-ex button:hover { background: var(--hover-fill); }
.pc-ex b { display: block; font-weight: 600; margin-bottom: 2px; }

/* the composer */
.pc-foot { flex: none; padding: 0 20px 16px; }
.pc-box { max-width: 760px; margin: 0 auto; border: 1px solid var(--border); border-radius: 18px;
  background: var(--card); display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; }
.pc-box:focus-within { border-color: var(--ring); }
.pc-box textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--foreground);
  font: inherit; font-size: 15px; line-height: 1.5; max-height: 220px; padding: 6px 0; }
.pc-box textarea::placeholder { color: var(--foreground); opacity: .55; }
.pc-send { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
.pc-send:disabled { opacity: .35; cursor: default; }
.pc-send svg { width: 16px; height: 16px; }
.pc-fine { max-width: 760px; margin: 8px auto 0; font-size: var(--text-xs); text-align: center; }

/* the book and the inbox, as pages of the same column */
.side-empty { border: 1px dashed var(--border); border-radius: 12px; padding: 18px; line-height: 1.55; }
.side-empty p { margin: 0; }
.pc-list { display: flex; flex-direction: column; gap: 10px; }

/* sign in */
.pc-sign { max-width: 360px; margin: 14vh auto 0; padding: 0 20px; }
.pc-sign h2 { font-family: var(--font-serif); font-weight: 500; font-size: 28px; margin: 0 0 8px; }
.pc-sign p { line-height: 1.5; margin: 0 0 18px; }
.pc-sign input { width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 9px; background: var(--input);
  color: var(--foreground); padding: 0 12px; font: inherit; margin-bottom: 10px; }
.pc-sign button { width: 100%; height: 40px; border-radius: 9px; border: 0; background: var(--primary);
  color: var(--primary-foreground); font-weight: 600; cursor: pointer; }
.pc-sign .e { margin-top: 10px; font-size: 13px; }

@media (max-width: 820px) {
  .pc { grid-template-columns: 1fr; }
  .pc-rail { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 20; transform: translateX(-100%);
    transition: transform .2s ease; }
  .pc.rail-open .pc-rail { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
  .pc-menu { display: grid; place-items: center; }
  .pc-ex { grid-template-columns: 1fr; }
  .pc-empty h2 { font-size: 28px; }
  .pc-user .b { max-width: 90%; }
}
svg.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
svg.icon.sm { width: 19px; height: 19px; stroke-width: 1.8; }
svg.icon.xs { width: 14px; height: 14px; stroke-width: 1.95; }
.layout-toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px);
  background: var(--primary); color: var(--primary-foreground); padding: 9px 14px; border-radius: 10px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
.layout-toast.show { opacity: 1; transform: translateX(-50%); }
</style>
<link rel="stylesheet" href="./css/plays.css?v=1">
</head>
<body>
<div class="pc" id="pc">
  <aside class="pc-rail" id="rail">
    <div class="pc-railtop">
      <a class="pc-brand" href="./" target="pivot-chart">Pivot.</a>
      <a class="pc-tochart" href="./" target="pivot-chart">Chart</a>
    </div>
    <button type="button" class="pc-new" id="newConv"><span aria-hidden="true">+</span> New play</button>
    <nav class="pc-nav">
      <button type="button" class="pc-item" data-view="positions"><span class="t">Positions</span><span class="s" id="navPnl"></span></button>
      <button type="button" class="pc-item" data-view="inbox"><span class="t">Inbox</span><span class="s" id="navInbox"></span></button>
    </nav>
    <div class="pc-scroll" id="railList"></div>
    <div class="pc-me" id="me"></div>
  </aside>
  <main class="pc-main">
    <div class="pc-bar">
      <button type="button" class="pc-menu" id="menuBtn" aria-label="Open the list">≡</button>
      <h1 id="barTitle">New play</h1>
    </div>
    <div class="pc-body" id="body"><div class="pc-col" id="col"></div></div>
    <div class="pc-foot" id="foot">
      <form class="pc-box" id="form">
        <textarea id="input" rows="1" placeholder="Describe a trade, a watch or a rule"></textarea>
        <button type="submit" class="pc-send" id="send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <div class="pc-fine">Every order is simulated on paper. Nothing is sent to a broker. This is analysis, not financial advice.</div>
    </div>
  </main>
</div>
<script src="./js/icons.js?v=49"></script>
<script src="./js/auth.js?v=11"></script>
<script src="./js/plays.js?v=9"></script>
<script src="./js/playchat.js?v=2"></script>
</body>
</html>
