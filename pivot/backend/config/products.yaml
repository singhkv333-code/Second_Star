# Pivot product economics — single source of truth.
#
# Hardcoding these in the system prompt led to product facts leaking into every
# greeting. They live here; the chatbot reads them via get_product_spec only
# when a user asks about Pivot itself, its navigation, or a named offering.

platform:
  name: Pivot
  type: platform_guide
  one_liner: >-
    One India-first workspace for researching securities, testing ideas and
    running them in a simulated paper book.
  surfaces:
    chart: Live candles, indicators, evidence-backed annotations and chart questions.
    company: Company profile, financials, quarters, peers, filings, ownership and flows.
    chat: Cross-market research, portfolio questions and plain-English task building.
    screener: Find and rank securities using fundamental and market constraints.
    strategies: Review, edit, backtest and activate saved automated workflows.
    portfolio: Holdings, exposure, performance, tax and risk context.
    paper: Simulated orders, positions, fills and journal; no live broker execution.
    options: NSE option chains, payoff analysis and defined-risk strategy construction.
  navigation_note: >-
    Use the focused page for questions about what is visible; use Chat for
    cross-surface work. Open a security's company or chart surface when the
    user needs primary evidence, and use Strategies or Paper to inspect what a
    built idea does after research.
  boundaries:
    - India-listed equities, indices, NSE options, MCX commodities and charted crypto.
    - Analysis and simulated execution only; Pivot is not a broker or registered adviser.

safegrow:
  name: SafeGrow
  type: capital_protection
  one_liner: >-
    A capital-guarantee structure: most of the principal goes into an
    arbitrage fund that compounds back to your starting amount; a small
    slice buys a Nifty call for upside.
  allocation:
    arbitrage_fund_pct: 92.764
    nifty_atm_call_pct: 7.236
  tenor_years: 1
  protected_capital_pct: 100
  notes: >-
    The exact split is derived from the Indian arbitrage fund yield needed
    to gross the safety leg back to par at 1y. If yields shift the split is
    recomputed; never quote it as an absolute marketing fact.

earnmore:
  name: EarnMore
  type: covered_call_income
  one_liner: >-
    Hold the underlying you already own; sell ATM weekly call options
    against it for premium income. Caps upside; cushions sideways markets.
  legs:
    - long: underlying
      side: hold
    - short: weekly_atm_call
      side: sell
      qty_per_lot: 1
  notes: >-
    Premium is quote-driven and varies with IV and expiry. Never invent a
    rupee premium — fetch live option data with the get_option_chain tool
    when the user asks for sizing math.

stormshield:
  name: StormShield
  type: bear_protection
  one_liner: >-
    A Nifty put debit spread: long ATM put, short OTM put. Pays off when
    Nifty falls between the two strikes; defined-risk hedge.
  legs:
    - long: nifty_atm_put
      side: buy
    - short: nifty_otm_put
      side: sell
  notes: >-
    Strike selection and net debit are quote-driven. Never invent strikes
    or premiums; ask the user for inputs or reach for live option data.
