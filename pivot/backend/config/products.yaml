# Pivot product economics — single source of truth.
#
# Hardcoding these in the system prompt led to "92.764%" leaking into every
# greeting. They live here; the chatbot reads them via the get_product_spec
# tool only when the user explicitly asks about Pivot's offerings.

safegrow:
  name: SafeGrow
  type: capital_protection
  one_liner: >-
    A capital-guarantee structure: most of the principal goes into an
    arbitrage fund that compounds back to your starting amount; a small
    slice buys a Nifty call for upside.
  allocation:
    arbitrage_fund_pct: 92.764
    nifty_atm_call_pct: 7.236
  tenor_years: 1
  protected_capital_pct: 100
  notes: >-
    The exact split is derived from the Indian arbitrage fund yield needed
    to gross the safety leg back to par at 1y. If yields shift the split is
    recomputed; never quote it as an absolute marketing fact.

earnmore:
  name: EarnMore
  type: covered_call_income
  one_liner: >-
    Hold the underlying you already own; sell ATM weekly call options
    against it for premium income. Caps upside; cushions sideways markets.
  legs:
    - long: underlying
      side: hold
    - short: weekly_atm_call
      side: sell
      qty_per_lot: 1
  notes: >-
    Premium is quote-driven and varies with IV and expiry. Never invent a
    rupee premium — fetch live option data with the get_option_chain tool
    when the user asks for sizing math.

stormshield:
  name: StormShield
  type: bear_protection
  one_liner: >-
    Mirror of SafeGrow — most of the principal goes into an arbitrage fund
    that compounds back to par; a small slice buys a Nifty ATM put. Profits
    when Nifty falls; capital returned if Nifty rises.
  allocation:
    arbitrage_fund_pct: 92.764
    nifty_atm_put_pct: 7.236
  tenor_months: 6
  protected_capital_pct: 100
  notes: >-
    The split is derived from the Indian arbitrage fund yield needed to gross
    the safety leg back to par at maturity. High-conviction bear note —
    growth leg expires worthless if Nifty rises.

barbell:
  name: Barbell
  type: gold_equity_balance
  one_liner: >-
    50/50 split between gold and equity ETFs (GOLDBEES and NIFTYBEES). Auto
    rebalance back to 50/50 whenever either leg drifts past 60% of the total
    portfolio value.
  allocation:
    goldbees_pct: 50
    niftybees_pct: 50
  rebalance:
    threshold_pct: 60
    rule: >-
      If either leg exceeds 60% of total portfolio value, sell the excess and
      buy the underweight leg back to 50/50.
  notes: >-
    No options, no derivatives — pure ETF rebalancing. Each rebalance is a
    taxable event; STCG (20%) applies if sold within 12 months, else LTCG
    (12.5% above ₹1.25L). Rebalances reset the holding clock for sold units.
