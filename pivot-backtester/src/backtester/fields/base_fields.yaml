# Base fields — direct lookups against mc.statement_lines.
#
# Each entry maps a stable, user-facing identifier to one or more raw
# `line_item` strings as written by Moneycontrol. The list is
# intentionally permissive: when we encounter a synonym in real data we add
# it here rather than touching engine code.
#
# Conventions
#   statement      — one of balance_sheet | profit_loss | cash_flow | ratios
#   basis_default  — standalone | consolidated. Resolver may override.
#   unit           — rupees_crore | rupees | ratio | percentage | shares
#                    (used only for unit-mismatch warnings)
#   ttm_eligible   — true if a `<name>_ttm` value can be derived. TTM sums the last
#                    4 `period_kind='quarterly'` rows when present, else falls back
#                    to the latest annual value (which already spans 12 months).
#                    The live mc data is annual-only, so the fallback is what fires.
#
# When in doubt about line_items, run:
#   SELECT DISTINCT line_item FROM mc.statement_lines
#    WHERE statement = '<...>' AND line_item ILIKE '%<keyword>%';

# ---- Profit & Loss -------------------------------------------------------

revenue:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    # Real mc line_items first (preference order is now authoritative); older
    # synonyms kept as fallbacks for any differently-formatted rows.
    - "Total Operating Revenues"
    - "Revenue From Operations [Net]"
    - "Total Revenue"
    - "Revenue From Operations [Gross]"
    - "Total Income From Operations"
    - "Revenue From Operations"
    - "Net Sales"
    - "Net Sales/Income from operations"
    - "Income from Operations"
  unit: rupees_crore
  description: "Top-line revenue for the period."

net_profit:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    - "Net Profit"
    - "Net Profit/(Loss) For the Period"
    - "Profit/Loss For The Period"
    - "Net Profit After Tax"
    - "Profit/(Loss) for the Period"
  unit: rupees_crore

operating_profit:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    - "Operating Profit"
    - "Operating Profit (Before OI, Interest & Exceptional Items)"
    - "EBITDA"
  unit: rupees_crore

eps_basic:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    - "Basic EPS"
    - "Basic EPS."
    - "Basic EPS (Rs.)"
  unit: rupees

eps_diluted:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    - "Diluted EPS"
    - "Diluted EPS."
    - "Diluted EPS (Rs.)"
  unit: rupees

interest_expense:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    - "Finance Costs"
    - "Interest"
    - "Finance Cost"
  unit: rupees_crore

