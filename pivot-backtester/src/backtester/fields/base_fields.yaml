    - "Operating Profit (Before OI, Interest & Exceptional Items)"
    - "EBITDA"
  unit: rupees_crore

eps_basic:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    - "Basic EPS"
    - "Basic EPS."
    - "Basic EPS (Rs.)"
  unit: rupees

eps_diluted:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
    - "Diluted EPS"
    - "Diluted EPS."
    - "Diluted EPS (Rs.)"
  unit: rupees

interest_expense:
  statement: profit_loss
  basis_default: consolidated
  ttm_eligible: true
  line_items:
