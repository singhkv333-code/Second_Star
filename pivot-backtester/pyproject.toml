[project]
name = "pivot-backtester"
version = "0.1.0"
description = "Point-in-time-correct fundamentals backtester over the Pivot financials database"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "lark>=1.1",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "jinja2>=3.1",
]

[project.scripts]
backtester = "backtester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtester"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Postgres",
]
