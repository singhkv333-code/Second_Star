[project]
name = "pivot-eval"
version = "0.1.0"
description = "Read-only eval runner for the Pivot chatbot — runs the 200-case dataset, scores, reports, suggests."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
pivot-eval = "pivot_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivot_eval"]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
